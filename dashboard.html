<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Leads | Blessed Studios</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container mobile-container">
        <header class="hero-section text-center">
            <p class="branding-subtitle">Admin Overview</p>
            <h1 class="main-title">Incoming Requests</h1>
            <a href="index.html" class="btn btn-outline" style="margin-top: 10px;">← Back to Public Site</a>
        </header>

        <section class="glass-card">
            <div id="leadsContainer">
                <p class="text-center" style="color: var(--text-muted);">Loading requests...</p>
            </div>
        </section>
    </div>

    <script>
        // Replace with your actual credentials!
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_API_KEY_HERE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');

            const { data: requests, error } = await supabase
                .from('project_requests')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color: #ffcccc;" class="text-center">Error fetching leads: ${error.message}</p>`;
                return;
            }

            if (!requests || requests.length === 0) {
                container.innerHTML = `<p class="text-center" style="color: var(--text-muted);">No quote requests submitted yet.</p>`;
                return;
            }

            container.innerHTML = requests.map(lead => `
                <div style="border-bottom: 1px solid var(--glass-border); padding: 15px 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <h3 style="font-size: 16px; color: var(--accent-cyan);">${lead.client_name}</h3>
                        <span style="font-size: 11px; background: rgba(255, 204, 0, 0.2); color: var(--gold-main); padding: 3px 8px; border-radius: 6px; font-weight: bold;">${lead.budget_range}</span>
                    </div>
                    <p style="font-size: 13px; color: var(--text-white); margin-bottom: 5px;">
                        <strong>Type:</strong> ${lead.project_type}
                    </p>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">
                        📱 WhatsApp: <a href="https://wa.me/${lead.phone.replace(/[^0-9]/g, '')}" target="_blank" style="color: var(--accent-cyan); font-weight: bold;">${lead.phone}</a> | ✉️ ${lead.email}
                    </p>
                    ${lead.project_description ? `<p style="font-size: 13px; color: var(--text-muted); background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin-top: 5px;">"${lead.project_description}"</p>` : ''}
                </div>
            `).join('');
        }

        loadLeads();
    </script>
</body>
</html>
