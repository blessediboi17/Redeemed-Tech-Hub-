<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CRM | Blessed Studios</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container mobile-container">
        <header class="hero-section text-center">
            <p class="branding-subtitle">Agency Command Center</p>
            <h1 class="main-title">Lead Pipeline</h1>
            <a href="index.html" class="btn btn-outline" style="margin-top: 10px;">← Back to Public Site</a>
        </header>

        <section class="glass-card">
            <div id="leadsContainer">
                <p class="text-center" style="color: var(--text-muted);">Loading live pipeline...</p>
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = 'dfspcyhkrubnblfjsdpr';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmc3BjeWhrcnVibmJsZmpzZHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Njg1OTEsImV4cCI6MjEwMzI0NDU5MX0.IdvYVrKdZdmPEseyOuFArPugEU2t78JawO1SZR9RqdU';
        const supabase = window.supabase.createClient(dfspcyhkrubnblfjsdpr, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmc3BjeWhrcnVibmJsZmpzZHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Njg1OTEsImV4cCI6MjEwMzI0NDU5MX0.IdvYVrKdZdmPEseyOuFArPugEU2t78JawO1SZR9RqdU);

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');

            const { data: requests, error } = await supabase
                .from('project_requests')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color: #ffcccc;" class="text-center">Error: ${error.message}</p>`;
                return;
            }

            if (!requests || requests.length === 0) {
                container.innerHTML = `<p class="text-center" style="color: var(--text-muted);">No requests in the pipeline yet.</p>`;
                return;
            }

            container.innerHTML = requests.map(lead => {
                const cleanPhone = lead.phone ? lead.phone.replace(/[^0-9]/g, '') : '';
                const whatsappMsg = encodeURIComponent(`Hello ${lead.client_name}, this is Blessed Studios following up on your ${lead.project_type} request!`);
                const currentStatus = lead.status || 'New';

                return `
                <div style="border-bottom: 1px solid var(--glass-border); padding: 18px 0;" id="lead-card-${lead.id}">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <div>
                            <h3 style="font-size: 17px; color: var(--accent-cyan); font-weight: 700;">${lead.client_name}</h3>
                            <span style="font-size: 11px; color: var(--text-muted);">${new Date(lead.created_at).toLocaleDateString()}</span>
                        </div>
                        <span style="font-size: 11px; background: rgba(255, 204, 0, 0.2); color: var(--gold-main); padding: 4px 10px; border-radius: 8px; font-weight: bold;">
                            ${lead.budget_range}
                        </span>
                    </div>

                    <p style="font-size: 13px; color: var(--text-white); margin-bottom: 8px;">
                        <strong>Requested:</strong> ${lead.project_type}
                    </p>

                    ${lead.project_description ? `
                        <p style="font-size: 12px; color: var(--text-muted); background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05);">
                            "${lead.project_description}"
                        </p>
                    ` : ''}

                    <!-- Status Selector & Action Controls -->
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 10px;">
                        <select onchange="updateStatus('${lead.id}', this.value)" style="background: var(--bg-dark); color: var(--gold-main); border: 1px solid var(--glass-border); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;">
                            <option value="New" ${currentStatus === 'New' ? 'selected' : ''}>Status: New</option>
                            <option value="Contacted" ${currentStatus === 'Contacted' ? 'selected' : ''}>Status: Contacted</option>
                            <option value="Proposal" ${currentStatus === 'Proposal' ? 'selected' : ''}>Status: Proposal Sent</option>
                            <option value="In Progress" ${currentStatus === 'In Progress' ? 'selected' : ''}>Status: In Progress</option>
                            <option value="Completed" ${currentStatus === 'Completed' ? 'selected' : ''}>Status: Completed</option>
                        </select>

                        <div style="display: flex; gap: 6px;">
                            <a href="https://wa.me/${cleanPhone}?text=${whatsappMsg}" target="_blank" class="btn btn-gold" style="padding: 6px 12px; font-size: 12px;">
                                💬 WhatsApp
                            </a>
                            <button onclick="deleteLead('${lead.id}')" style="background: rgba(255,50,50,0.2); color: #ff8888; border: 1px solid rgba(255,50,50,0.3); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">
                                🗑️
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function updateStatus(id, newStatus) {
            const { error } = await supabase
                .from('project_requests')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) {
                alert('Error updating status: ' + error.message);
            }
        }

        async function deleteLead(id) {
            if (!confirm("Are you sure you want to delete this quote request?")) return;
            
            const { error } = await supabase
                .from('project_requests')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error deleting lead: ' + error.message);
            } else {
                document.getElementById(`lead-card-${id}`).remove();
            }
        }

        loadLeads();
    </script>
</body>
</html>
